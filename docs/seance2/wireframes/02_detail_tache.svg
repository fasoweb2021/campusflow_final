<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="system-ui, sans-serif">
  <!-- Fond -->
  <rect width="360" height="800" fill="#F8F9FA" />

  <!-- Barre de statut -->
  <rect width="360" height="24" fill="#E9ECEF" />
  <text x="16" y="17" font-size="12" font-weight="bold" fill="#495057">08:30</text>
  <text x="310" y="17" font-size="11" fill="#495057">4G ■ 85%</text>

  <!-- En-tête AppBar avec bouton retour -->
  <rect y="24" width="360" height="56" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1" />
  <text x="20" y="58" font-size="20" fill="#212529">←</text>
  <text x="56" y="59" font-size="18" font-weight="bold" fill="#212529">Détail de la tâche</text>

  <!-- Carte d'informations de la tâche -->
  <g transform="translate(16, 96)">
    <rect width="328" height="420" rx="12" fill="#FFFFFF" stroke="#CED4DA" />

    <!-- Badges Statut et Cours -->
    <rect x="20" y="20" width="80" height="26" rx="13" fill="#E9ECEF" />
    <text x="60" y="37" font-size="11" font-weight="bold" fill="#495057" text-anchor="middle">Dév Mobile</text>

    <rect x="110" y="20" width="100" height="26" rx="13" fill="#343A40" />
    <text x="160" y="37" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⚠️ EN RETARD</text>

    <!-- Titre -->
    <text x="20" y="80" font-size="18" font-weight="bold" fill="#212529">Projet Mobile - TP06 Wireframes</text>

    <!-- Séparateur -->
    <line x1="20" y1="102" x2="308" y2="102" stroke="#E9ECEF" stroke-width="1" />

    <!-- Date d'échéance -->
    <text x="20" y="130" font-size="12" fill="#6C757D">Date limite de rendu</text>
    <text x="20" y="152" font-size="15" font-weight="bold" fill="#212529">Hier, 23 novembre 2026 à 23:59</text>

    <!-- Enseignant / Salle -->
    <text x="20" y="190" font-size="12" fill="#6C757D">Cours associé &amp; Enseignant</text>
    <text x="20" y="212" font-size="14" fill="#212529">Programmation Mobile (M1 MSI)</text>
    <text x="20" y="232" font-size="13" fill="#495057">Salle : Labo Info 2 • Enseignant : Dr. Ouédraogo</text>

    <!-- Description -->
    <text x="20" y="272" font-size="12" fill="#6C757D">Description &amp; Consignes</text>
    <rect x="20" y="286" width="288" height="110" rx="8" fill="#F8F9FA" stroke="#E9ECEF" />
    <text x="32" y="310" font-size="13" fill="#212529">Concevoir les 5 wireframes basse fidélité</text>
    <text x="32" y="330" font-size="13" fill="#212529">au format 360x800 ainsi que les 3 variantes</text>
    <text x="32" y="350" font-size="13" fill="#212529">de l'écran Échéances pour comparaison.</text>
  </g>

  <!-- Bouton d'action principal FilledButton (Marquer comme fait) -->
  <g transform="translate(16, 540)">
    <rect width="328" height="48" rx="12" fill="#212529" />
    <text x="164" y="30" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓ Marquer comme fait</text>
  </g>

  <!-- Bouton secondaire (Modifier) -->
  <g transform="translate(16, 600)">
    <rect width="328" height="48" rx="12" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1" />
    <text x="164" y="30" font-size="14" font-weight="bold" fill="#495057" text-anchor="middle">Modifier l'échéance</text>
  </g>
</svg>
